name: Colony checks

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: colony-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
      - run: node --check observatory/dist/app.js
      - run: python3 -m colony init && python3 -m colony export --output artifacts/state.json
  lean-seed:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: python3 scripts/evaluate_lean.py --output artifacts/benchmark-results.json
      - name: Install proof export sandbox
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Expose the pinned independent kernel binaries
        run: dirname "$(elan which lean)" >> "$GITHUB_PATH"
        working-directory: lean
      - name: Compare fixed theorem roots and replay with an independent kernel
        run: lake comparator --config comparator.json
        working-directory: lean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-seed-evidence
          path: artifacts/
